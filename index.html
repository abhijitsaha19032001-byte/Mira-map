<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আসল ৩ডি ম্যাপ — পৃথিবী থেকে কলকাতার রাস্তা</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
html,body,#map{height:100%;margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif}
#bar{position:absolute;top:10px;left:10px;right:10px;z-index:5;display:flex;gap:6px}
#q{flex:1;padding:12px;border-radius:12px;border:1px solid #ccc;font-size:15px}
button{padding:10px 12px;border-radius:12px;border:1px solid #bbb;background:#fff;font-size:14px}
#tb{position:absolute;bottom:24px;left:10px;right:10px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#res{position:absolute;top:62px;left:10px;right:10px;z-index:5;background:#fff;border-radius:12px;max-height:40%;overflow:auto;display:none}
#res div{padding:10px 12px;border-bottom:1px solid #eee;font-size:14px}
</style></head><body>
<div id="bar"><input id="q" placeholder="ঠিকানা বা জায়গা খুঁজুন…"><button id="go">খুঁজুন</button></div>
<div id="res"></div>
<div id="map"></div>
<div id="tb"><button id="k">📍 কলকাতা ৩ডি</button><button id="g">🌍 পৃথিবী</button><button id="t">↕️ টিল্ট</button><button id="loc">🎯 আমার অবস্থান</button></div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
const $=i=>document.getElementById(i);
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[88.3426,22.5726],zoom:16,pitch:60,bearing:-20,maxPitch:85});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}));
map.on('style.load',()=>map.setProjection({type:'globe'}));
let mk=null,pop=null;
function show(lng,lat,html){if(mk)mk.remove();mk=new maplibregl.Marker({color:'#d33'}).setLngLat([lng,lat]).addTo(map);if(pop)pop.remove();pop=new maplibregl.Popup({offset:28}).setLngLat([lng,lat]).setHTML(html).addTo(map)}
async function nom(u){const r=await fetch(u,{headers:{'Accept-Language':'bn,en'}});return r.json()}
async function search(){const v=$('q').value.trim();if(!v)return;const d=await nom('https://nominatim.openstreetmap.org/search?format=json&limit=6&addressdetails=1&q='+encodeURIComponent(v));
const r=$('res');r.innerHTML='';r.style.display='block';if(!d.length)r.textContent='কিছু পাওয়া যায়নি';
d.forEach(p=>{const e=document.createElement('div');e.textContent=p.display_name;e.onclick=()=>{r.style.display='none';map.flyTo({center:[+p.lon,+p.lat],zoom:18,pitch:60,speed:.8});show(+p.lon,+p.lat,'<b>'+p.display_name+'</b>')};r.appendChild(e)})}
$('go').onclick=search;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
map.on('click',async e=>{try{const d=await nom('https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&addressdetails=1&lat='+e.lngLat.lat+'&lon='+e.lngLat.lng);show(e.lngLat.lng,e.lngLat.lat,'<b>'+(d.display_name||'ঠিকানা পাওয়া যায়নি')+'</b><br>'+e.lngLat.lat.toFixed(5)+', '+e.lngLat.lng.toFixed(5))}catch(x){}});
$('k').onclick=()=>map.flyTo({center:[88.3426,22.5726],zoom:16,pitch:60,bearing:-20});
$('g').onclick=()=>map.flyTo({center:[88.36,22.57],zoom:1.6,pitch:0,bearing:0});
$('t').onclick=()=>map.easeTo({pitch:map.getPitch()>30?0:70});
$('loc').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:17,pitch:60});show(p.coords.longitude,p.coords.latitude,'আপনি এখানে')});
</script></body></html>
